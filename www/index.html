<!DOCTYPE html>
<html lang="en">

<head>
    <!--ctime 2025-02-06, mtime 2025-09-27-->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="show">
    <link href="/style.css" rel="stylesheet">
    <title>sup.</title>
    <style>
        table {
            border-collapse: collapse;
            border: 2px solid rgb(140 140 140);
            font-family: sans-serif;
            font-size: 0.8rem;
            letter-spacing: 1px;
        }

        caption {
            caption-side: bottom;
            padding: 10px;
            font-weight: bold;
        }

        thead,
        tfoot {
            background-color: rgb(228 240 245);
        }

        th,
        td {
            border: 1px solid rgb(160 160 160);
            padding: 8px 10px;
        }

        td:last-of-type {
            text-align: center;
        }

        tbody>tr:nth-of-type(even) {
            background-color: rgb(237 238 242);
        }

        tfoot th {
            text-align: right;
        }

        tfoot td {
            font-weight: bold;
        }
    </style>
</head>

<body>
    <button id="clear">clear</button>
    <button id="reload">reload</button>
    <input type="file" id="filepicker" multiple accept="application/json">
    <br>
    <table>
        <thead>
            <tr>
                <td>name</td>
                <td>colour</td>
                <td>remove</td>
            </tr>
        </thead>
        <tbody id="speakerstable">

        </tbody>
    </table>

    <div id="renderarea"></div>

    <script src="main.js" type="module"></script>
</body>

</html>
